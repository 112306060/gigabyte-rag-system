[project]
name = "aorus-rag"
version = "0.1.0"
description = "Hand-written RAG for GIGABYTE AORUS MASTER 16 AM6H spec Q&A (zh-TW / English) on a 4GB-VRAM laptop GPU with llama.cpp"
readme = "README.md"
authors = [
    { name = "David Liu", email = "david7471906@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "opencc>=1.4.2",
]

[project.scripts]
aorus-rag = "aorus_rag.cli:main"
aorus-bench = "aorus_rag.benchmark:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
